name: Market segment report layout evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/inspect_market_segment_layouts.py'
      - '.github/workflows/market-segment-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-reports.txt
      - run: python scripts/inspect_market_segment_layouts.py
