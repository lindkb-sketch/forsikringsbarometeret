name: Verify official reports and presentations (diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-reports.txt
      - name: Discover issuer-linked PDFs without changing financial feed
        run: python scripts/discover_reports.py
      - name: Verify downloaded PDF bytes, period, issuer and SHA256
        run: python scripts/verify_nine_document_bytes.py
      - name: Save document verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nine-issuer-dual-document-evidence
          path: |
            data/report_candidates.json
            data/dual_document_verification.json
          if-no-files-found: warn
