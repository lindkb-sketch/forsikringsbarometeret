name: Verify official reports and presentations (diagnostic)
on:
  workflow_dispatch:
  schedule:
    - cron: '8 6,12,18 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_nine_issuer_documents.py'
      - 'scripts/reconcile_issuer_presentation_metrics.py'
      - 'tests/test_nine_issuer_dual_audit.py'
      - '.github/workflows/verify-dual-documents.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_nine_issuer_documents.py'
      - 'scripts/reconcile_issuer_presentation_metrics.py'
      - 'scripts/reconcile_nine_pdf_metrics.py'
      - 'scripts/verify_nine_document_bytes.py'
      - '.github/workflows/verify-dual-documents.yml'
      - 'data/nine_insurer_comparison.json'
permissions:
  contents: read
jobs:
  verify-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-reports.txt playwright
      - name: Check preinstalled browser for issuer pages rendered by JavaScript
        run: google-chrome --version
      - name: Test period-specific issuer discovery and evidence gates
        run: python -m unittest discover -s tests -p 'test_nine_issuer_dual_audit.py' -v
      - name: Download and audit current issuer documents without publishing financial values
        run: python scripts/audit_nine_issuer_documents.py
      - name: Require all applicable documents and zero reconciled metric conflicts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('data/nine_issuer_dual_audit.json').read_text())
          if not result['all_required_documents_verified']:
              raise SystemExit('One or more required issuer documents are unverified')
          conflicts=[(c['company'],m['metric'],m['period_type']) for c in result['companies'] for m in c['cross_document_matches'] if m['status']=='conflict']
          if conflicts:raise SystemExit('Conflicting independently extracted metrics: '+repr(conflicts))
          PY
      - name: Require both Alm. Brand documents discovered from its own investor portal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('data/nine_issuer_dual_audit.json').read_text())
          alm=next(x for x in result['companies'] if x['company']=='Alm. Brand')
          if not (alm['issuer_report_verified'] and alm['issuer_presentation_verified']):
              raise SystemExit('Alm. Brand: primary-source report or presentation is still unverified')
          PY
      - name: Save actual issuer documents and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nine-issuer-dual-document-evidence
          path: |
            dual-audit/
            data/nine_issuer_dual_audit.json
          if-no-files-found: warn
          retention-days: 14
