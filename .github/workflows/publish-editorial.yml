name: Publish editorial frontend update
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forsikringsbarometeret-publish
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert editorial brief has qualitative text and no repeated KPI figures
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          a=json.loads(Path('data/quarterly_editorial.json').read_text())
          assert a['period'] in a['periods']
          briefs=a['periods'][a['period']]['brief']
          assert briefs and a['brief']==briefs
          for row in briefs:
              text=row['text']
              assert row.get('type')=='qualitative_quarter_theme'
              assert not re.search(r'\d+[,.]?\d*\s*(?:%|MNOK|NOKm|MDKK|DKKm)',text),text
              assert row.get('source_url','').startswith('https://')
          print('EDITORIAL_DEPLOY_CHECK PASS',a['period'],len(briefs))
          PY
