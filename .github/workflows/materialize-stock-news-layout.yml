name: Materialize tested stock and news layout (one-time)
on:
  push:
    branches: [ui/kursutvikling-borsnytt-20261105-publish]
    paths: ['.github/workflows/materialize-stock-news-layout.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Apply exact locally tested patch with input and output hash guards
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, subprocess, tempfile
          from pathlib import Path
          before = {'index.html':'42abbd6de94d15817418721ee6c54d1b1379ab6a','tests/test_company_exchange_notices.py':'8aedf707de5795230a4049b83b4816c4f0a3eae6'}
          after = {'index.html':'15d1bad760d170c103660b257c6ca5b845d98d1f','tests/test_company_exchange_notices.py':'3b19283915f01d2899a5592fc96d9f8c6d279ebf','tests/test_stock_news_layout.py':'ccd00089115a2deeaebdb8f55d0934830cc3cfd6'}
          def blob(path):
              data=Path(path).read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for path,sha in before.items():
              assert blob(path)==sha, 'Base changed: '+path
          assert not Path('tests/test_stock_news_layout.py').exists()
          encoded=''
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='21e836534da6cdb75e273913811d9829dae5f1ffb9b369602f28dc658a5d627b'
          with tempfile.NamedTemporaryFile() as file:
              file.write(patch); file.flush()
              subprocess.run(['git','apply','--check','--unidiff-zero',file.name],check=True)
              subprocess.run(['git','apply','--unidiff-zero',file.name],check=True)
          for path,sha in after.items():
              assert blob(path)==sha, 'Output differs from locally tested file: '+path
          print('EXACT_TESTED_LAYOUT_APPLIED',after)
          PY
      - name: Verify syntax, NewsWeb integration and unchanged stock calculations
        run: |
          python -m unittest discover -s tests -p 'test_company_exchange_notices.py' -v
          python -m unittest discover -s tests -p 'test_stock_news_layout.py' -v
          python -m unittest discover -s tests -p 'test_stock_quote_integrity.py' -v
          python -m unittest discover -s tests -p 'test_dashboard_runtime.py' -v
          python tests/check_dashboard.py
          git diff --check
      - name: Commit only the three validated files to this delivery branch
        run: |
          set -euo pipefail
          branch='ui/kursutvikling-borsnytt-20261105-publish'
          test "$GITHUB_REF" = "refs/heads/$branch"
          git fetch origin "$branch"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$branch")"
          git add -- index.html tests/test_company_exchange_notices.py tests/test_stock_news_layout.py
          python - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert changed=={'index.html','tests/test_company_exchange_notices.py','tests/test_stock_news_layout.py'},changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrer kursgraf og siste NewsWeb-melding i responsivt sidepanel'
          git push origin "HEAD:refs/heads/$branch"
