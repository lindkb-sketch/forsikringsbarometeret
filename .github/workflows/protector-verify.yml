name: Protector official KPI verification
on:
  workflow_dispatch:
  schedule:
    - cron: '41 6,12,18 * * *'
  push:
    branches: [main]
    paths:
      - scripts/protector_kpi_check.py
      - scripts/protector_publish.py
      - .github/workflows/protector-verify.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Q4 and next-year quarter parsing
        run: python -m unittest discover -s tests -p 'test_protector*.py' -v
      - name: Install PDF extraction dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Verify official group and Norway KPI values
        run: python scripts/protector_kpi_check.py
      - name: Import Protector values only with PDF page provenance
        run: python scripts/protector_publish.py
      - name: Rebuild quarterly editorial from verified feed
        run: python scripts/build_editorial.py
      - name: Audit all imported observations
        run: python scripts/audit_financials.py
      - name: Commit verified Protector feed and quarterly editorial
        run: |
          if ! git diff --quiet -- data/financial_observations.json data/verified_financial_feed.json data/quarterly_editorial.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/financial_observations.json data/verified_financial_feed.json data/quarterly_editorial.json
            git commit -m 'Publish PDF-verified Protector quarterly observations'
            git push origin HEAD:main
          fi
