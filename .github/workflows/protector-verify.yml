name: Protector official KPI verification
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forsikringsbarometeret-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Q4 and next-year quarter parsing
        run: python -m unittest discover -s tests -p 'test_protector*.py' -v
      - name: Install PDF extraction dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Verify official group and Norway KPI values
        run: python scripts/protector_kpi_check.py
      - name: Import Protector values only with PDF page provenance
        run: python scripts/protector_publish.py
      - name: Update independent news and Protector delayed stock quote
        run: |
          python scripts/ingest_media_news.py || echo 'News source temporarily unavailable; retaining last feed'
          python scripts/update_stock_prices.py
      - name: Rebuild quarterly editorial from verified feed
        run: python scripts/build_editorial.py
      - name: Audit all imported observations
        run: python scripts/audit_financials.py
