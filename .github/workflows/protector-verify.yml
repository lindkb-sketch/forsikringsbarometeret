name: Protector official KPI verification
on:
  workflow_dispatch:
  schedule:
    - cron: '27 * * * *'
  push:
    branches: [main]
    paths:
      - scripts/protector_kpi_check.py
      - scripts/protector_publish.py
      - .github/workflows/protector-verify.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: forsikringsbarometeret-publish-v2
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Q4 and next-year quarter parsing
        run: python -m unittest discover -s tests -p 'test_protector*.py' -v
      - name: Install PDF extraction dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Verify official group and Norway KPI values
        run: python scripts/protector_kpi_check.py
      - name: Import Protector values only with PDF page provenance
        run: python scripts/protector_publish.py
      - name: Update independent news and Protector delayed stock quote
        run: |
          python scripts/ingest_media_news.py || echo 'News source temporarily unavailable; retaining last feed'
          python scripts/update_stock_prices.py
      - name: Rebuild quarterly editorial from verified feed
        run: python scripts/build_editorial.py
      - name: Audit all imported observations
        run: python scripts/audit_financials.py
      - name: Commit verified Protector feed and quarterly editorial
        run: |
          if ! git diff --quiet -- data/financial_observations.json data/verified_financial_feed.json data/quarterly_editorial.json data/stock_prices.json data/official_news.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/financial_observations.json data/verified_financial_feed.json data/quarterly_editorial.json data/stock_prices.json data/official_news.json
            git commit -m 'Publish PDF-verified Protector quarterly observations'
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; echo 'Automatic generated-file merge conflict; refusing to overwrite'; exit 1; }
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 4 ]; then echo 'Failed to publish after four safe retries'; exit 1; fi
              sleep 3
            done
          fi
      - name: Refresh main for Pages publication
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
      - name: Verify published Protector finance, stock, news and editorial
        run: python scripts/verify_public_pages.py
