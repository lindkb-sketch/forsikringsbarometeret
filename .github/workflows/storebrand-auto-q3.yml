name: Storebrand automatic quarterly publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/storebrand-auto-q3.yml'
      - 'scripts/storebrand_*.py'
      - 'scripts/import_storebrand_reports.py'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: forsikringsbarometeret-publish
  cancel-in-progress: false
jobs:
  storebrand-q3:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Inspect official Q1 and Q2 source table layouts
        run: |
          python - <<'PY'
          import sys,tempfile
          from pathlib import Path
          import pdfplumber
          sys.path.insert(0,'scripts')
          from storebrand_sources import discover
          from storebrand_automation_check import choose_reports,download_pdf
          records=discover(year=2026)['reports']
          for q in (1,2):
            selected=choose_reports(records,2026,q)
            for scope in ('group','norway'):
              with tempfile.TemporaryDirectory() as d:
                p=Path(d)/'source.pdf';download_pdf(selected[scope]['document_url'],p)
                with pdfplumber.open(p) as pdf:
                  print('SOURCE_LAYOUT',q,scope,'pages',len(pdf.pages))
                  for i in ([4,7] if scope=='group' else [1,3,10]):
                    if i<len(pdf.pages):
                      t=pdf.pages[i].extract_text() or ''
                      print('SOURCE_PAGE',q,scope,i,repr(t[:5200]))
          PY
      - name: Verify Q1 and Q2 imports from official PDFs
        run: |
          python - <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from storebrand_sources import discover
          from storebrand_automation_check import choose_reports,download_pdf
          from import_storebrand_reports import parse_group,parse_norway
          records=discover(year=2026)['reports']
          for q in (1,2):
            selected=choose_reports(records,2026,q)
            with tempfile.TemporaryDirectory() as d:
              gp,np=Path(d)/'group.pdf',Path(d)/'norway.pdf'
              download_pdf(selected['group']['document_url'],gp)
              download_pdf(selected['norway']['document_url'],np)
              rows=parse_group(gp,selected['group']['document_url'],2026,q)+parse_norway(np,selected['norway']['document_url'],2026,q)
              print('STOREBRAND EARLY VERIFIED',q,[(r['scope'],r['metric'],r['value']) for r in rows])
              assert len(rows)==11 and all(r['quarter']==q and r['year']==2026 for r in rows)
          PY
      - name: Verify required Storebrand files
        run: python scripts/storebrand_preflight.py
      - name: Run isolated Storebrand tests
        run: python -m unittest discover -s tests -p 'test_storebrand*.py' -v
      - name: Check original PDFs offline
        run: |
          python scripts/storebrand_automation_check.py --group tests/fixtures/storebrand_asa_q3_2026.pdf --norway tests/fixtures/storebrand_forsikring_q3_2026.pdf --output data/storebrand_offline_test.json
      - name: Validate existing financial observations
        run: python scripts/audit_financials.py
      - name: Discover and validate Storebrand reports for every published quarter
        run: |
          python - <<'PY'
          import subprocess,sys
          from datetime import date
          sys.path.insert(0,'scripts')
          from storebrand_sources import discover
          from storebrand_automation_check import choose_reports
          this_year=date.today().year
          for year in range(2026,this_year+1):
              records=discover(year=year)['reports']
              periods=sorted({r['quarter'] for r in records if r.get('year')==year})
              for quarter in periods:
                  # The insurance subsidiary may not publish Q4 separately.
                  scopes={r.get('scope') for r in records if r.get('quarter')==quarter}
                  if scopes!={'group','norway'}:
                      print('STOREBRAND_SOURCE_INCOMPLETE',year,quarter,sorted(scopes),'— will retry automatically; no unsupported figures published',flush=True)
                      continue
                  print('STOREBRAND_VALIDATE',year,quarter,flush=True)
                  try:
                      subprocess.run([sys.executable,'scripts/storebrand_publish_q3.py',
                                      '--year',str(year),'--quarter',str(quarter)],check=True)
                  except subprocess.CalledProcessError:
                      # Never publish unsupported layouts or estimated figures.
                      # Retry on the next scheduled run without blocking other quarters.
                      print('::warning::Storebrand issuer PDF could not be independently verified for Q'+str(quarter)+' '+str(year)+'; withholding that quarter and retrying later',flush=True)
          PY
      - name: Audit imported observations and feed
        run: |
          python scripts/audit_financials.py
          python -m json.tool data/financial_observations.json > /dev/null
          python -m json.tool data/verified_financial_feed.json > /dev/null
      - name: Commit only audited observations and feed
        run: |
          if ! git diff --quiet -- data/financial_observations.json data/verified_financial_feed.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/financial_observations.json data/verified_financial_feed.json
            git commit -m 'Publish verified Storebrand quarterly observations'
            git push origin HEAD:main
          else
            echo 'No changes in verified Storebrand observations.'
          fi
      - name: Refresh latest committed feed before Pages deployment
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          p=json.load(open('data/verified_financial_feed.json'))
          found={(r['quarter'],r['scope']) for r in p['observations'] if r['company']=='Storebrand' and r['year']==2026}
          assert all((q,s) in found for q in (1,2,3) for s in ('group','norway')),found
          print('Storebrand baseline verified and future reported quarters preserved:',len(found))
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Storebrand quarterly feed on public GitHub Pages
        run: |
          python - <<'PY'
          import json, time, urllib.request
          url = 'https://lindkb-sketch.github.io/forsikringsbarometeret/data/verified_financial_feed.json'
          expected = json.load(open('data/verified_financial_feed.json', encoding='utf-8'))
          def key(r):
              return tuple(r[k] for k in ('company','year','quarter','scope','period_type','metric'))
          wanted = {key(r): r['value'] for r in expected['observations']
                    if r['company'] == 'Storebrand' and r['year'] >= 2026}
          assert wanted and all(any(k[1]==2026 and k[2]==q and k[3]==scope for k in wanted) for q in (1,2,3) for scope in ('group','norway')), 'Missing historical Storebrand baseline'
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url + '?verification=' + str(int(time.time())),
                                               headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      assert response.status == 200
                      actual = json.load(response)
                  got = {key(r): r['value'] for r in actual['observations']
                         if r['company'] == 'Storebrand' and r['year'] == 2026}
                  if got == wanted:
                      print('PUBLISHED STOREBRAND QUARTERS VERIFIED:', len(wanted), 'observations match live GitHub Pages')
                      break
                  print('Published feed not yet synchronized:', len(got), 'of', len(wanted))
              except Exception as e:
                  print('Published feed not yet accessible:', repr(e))
              if attempt == 11:
                  raise SystemExit('GitHub Pages publication could not be verified')
              time.sleep(10)
          PY
