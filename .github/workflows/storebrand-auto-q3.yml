name: Storebrand automatic quarterly publication
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forsikringsbarometeret-publish
  cancel-in-progress: false
jobs:
  storebrand-q3:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Inspect official Q1 and Q2 source table layouts
        run: |
          python - <<'PY'
          import sys,tempfile
          from pathlib import Path
          import pdfplumber
          sys.path.insert(0,'scripts')
          from storebrand_sources import discover
          from storebrand_automation_check import choose_reports,download_pdf
          records=discover(year=2026)['reports']
          for q in (1,2):
            selected=choose_reports(records,2026,q)
            for scope in ('group','norway'):
              with tempfile.TemporaryDirectory() as d:
                p=Path(d)/'source.pdf';download_pdf(selected[scope]['document_url'],p)
                with pdfplumber.open(p) as pdf:
                  print('SOURCE_LAYOUT',q,scope,'pages',len(pdf.pages))
                  for i in ([4,7] if scope=='group' else [1,3,10]):
                    if i<len(pdf.pages):
                      t=pdf.pages[i].extract_text() or ''
                      print('SOURCE_PAGE',q,scope,i,repr(t[:5200]))
          PY
      - name: Verify Q1 and Q2 imports from official PDFs
        run: |
          python - <<'PY'
          import sys,tempfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from storebrand_sources import discover
          from storebrand_automation_check import choose_reports,download_pdf
          from import_storebrand_reports import parse_group,parse_norway
          records=discover(year=2026)['reports']
          for q in (1,2):
            selected=choose_reports(records,2026,q)
            with tempfile.TemporaryDirectory() as d:
              gp,np=Path(d)/'group.pdf',Path(d)/'norway.pdf'
              download_pdf(selected['group']['document_url'],gp)
              download_pdf(selected['norway']['document_url'],np)
              rows=parse_group(gp,selected['group']['document_url'],2026,q)+parse_norway(np,selected['norway']['document_url'],2026,q)
              print('STOREBRAND EARLY VERIFIED',q,[(r['scope'],r['metric'],r['value']) for r in rows])
              assert len(rows)==12 and all(r['quarter']==q and r['year']==2026 for r in rows)
          PY
      - name: Verify required Storebrand files
        run: python scripts/storebrand_preflight.py
      - name: Run isolated Storebrand tests
        run: python -m unittest discover -s tests -p 'test_storebrand*.py' -v
      - name: Check original PDFs offline
        run: |
          python scripts/storebrand_automation_check.py --group tests/fixtures/storebrand_asa_q3_2026.pdf --norway tests/fixtures/storebrand_forsikring_q3_2026.pdf --output data/storebrand_offline_test.json
      - name: Validate existing financial observations
        run: python scripts/audit_financials.py
      - name: Discover and validate Storebrand reports for every published quarter
        run: |
          python - <<'PY'
          import subprocess,sys
          from datetime import date
          sys.path.insert(0,'scripts')
          from storebrand_sources import discover
          from storebrand_automation_check import choose_reports
          this_year=date.today().year
          for year in range(2026,this_year+1):
              records=discover(year=year)['reports']
              periods=sorted({r['quarter'] for r in records if r.get('year')==year})
              for quarter in periods:
                  # The insurance subsidiary may not publish Q4 separately.
                  scopes={r.get('scope') for r in records if r.get('quarter')==quarter}
                  if scopes!={'group','norway'}:
                      print('STOREBRAND_SOURCE_INCOMPLETE',year,quarter,sorted(scopes),'— will retry automatically; no unsupported figures published',flush=True)
                      continue
                  print('STOREBRAND_VALIDATE',year,quarter,flush=True)
                  try:
                      subprocess.run([sys.executable,'scripts/storebrand_publish_q3.py',
                                      '--year',str(year),'--quarter',str(quarter)],check=True)
                  except subprocess.CalledProcessError:
                      # Never publish unsupported layouts or estimated figures.
                      # Retry on the next scheduled run without blocking other quarters.
                      print('::warning::Storebrand issuer PDF could not be independently verified for Q'+str(quarter)+' '+str(year)+'; withholding that quarter and retrying later',flush=True)
          PY
      - name: Audit imported observations and feed
        run: |
          python scripts/audit_financials.py
          python -m json.tool data/financial_observations.json > /dev/null
          python -m json.tool data/verified_financial_feed.json > /dev/null
