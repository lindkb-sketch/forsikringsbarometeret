name: Sampo official quarterly segment verification
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forsikringsbarometeret-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-reports.txt
      - name: Test future Sampo Q3, Q4 and new-year report contracts
        run: python -m unittest discover -s tests -p test_sampo_future.py -v
      - name: Regression test with real official Q4 2025 report
        run: python -m unittest discover -s tests -p test_sampo_real_q4.py -v
      - name: Audit original financial source documents (report unresolved evidence)
        run: python scripts/verify_source_evidence.py
      - name: Upload per-observation original-source evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financial-source-evidence
          path: data/source_evidence_audit.json
          if-no-files-found: warn
      - name: Check quarterly runtime JavaScript syntax
        run: node --check scripts/quarterly_runtime.js
      - name: Verify future-quarter Gjensidige PM/BM extractor
        run: python -m unittest discover -s tests -p test_gjensidige_segments.py -v
      - name: Verify Norway and Nordic segment feed bindings
        run: python -m unittest discover -s tests -p test_segment_runtime_binding.py -v
      - name: Parse and audit official Sampo PDF tables
        run: |
          python scripts/sampo_publish.py
          python scripts/audit_financials.py
      - name: Verify sourced Sampo Q3 2025 coverage
        run: python -m unittest discover -s tests -p test_sampo_q3_2025_source.py -v
      - name: Rebuild source-to-feed publication provenance
        run: python scripts/publication_provenance.py
      - name: Build quarterly editorial
        run: python scripts/build_editorial.py
