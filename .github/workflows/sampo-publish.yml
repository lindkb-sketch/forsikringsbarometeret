name: Sampo official quarterly segment verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sampo_publish.py'
      - '.github/workflows/sampo-publish.yml'
  schedule:
    - cron: '52 7,13 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sampo-verified-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-reports.txt
      - name: Parse and audit official Sampo PDF tables
        run: |
          python scripts/sampo_publish.py
          python scripts/audit_financials.py
      - name: Build quarterly editorial
        run: python scripts/build_editorial.py
      - name: Commit only validated finance and editorial
        run: |
          if ! git diff --quiet -- data/financial_observations.json data/verified_financial_feed.json data/quarterly_editorial.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/financial_observations.json data/verified_financial_feed.json data/quarterly_editorial.json
            git commit -m 'Publish verified Sampo Nordic segments'
            git push origin HEAD:main
          fi
      - run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
      - name: Verify live published financial feed
        run: python scripts/verify_public_pages.py
