name: Test Storebrand separately
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storebrand-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Storebrand unit tests
        run: python -m unittest discover -s tests -p 'test_storebrand*.py' -v
      - name: Find, download and validate both Storebrand Q3 2026 PDFs
        run: python scripts/storebrand_automation_check.py
      - name: Upload isolated test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storebrand-isolated-test
          path: data/storebrand_automation_test.json
          if-no-files-found: warn
