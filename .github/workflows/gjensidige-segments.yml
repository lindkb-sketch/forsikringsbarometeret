name: Gjensidige PM BM official source validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/gjensidige_segments.py'
      - 'scripts/discover_gjensidige_sources.py'
      - 'scripts/reconcile_gjensidige_segments.py'
      - 'tests/test_gjensidige_reconciliation.py'
      - 'tests/test_gjensidige_discovery.py'
      - 'scripts/validate_gjensidige_pdf_segments.py'
      - 'scripts/import_gjensidige_pdf_norway.py'
      - 'tests/test_gjensidige_pdf_ratio_amounts.py'
      - '.github/workflows/gjensidige-segments.yml'
  schedule:
    - cron: '17 8 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parsing dependencies
        run: python -m pip install pymupdf
      - name: Validate Norway PDF extraction tests
        run: python -m unittest discover -s tests -p test_gjensidige_pdf_ratio_amounts.py -v
      - name: Validate PM/BM directly from official quarterly PDF
        run: python scripts/validate_gjensidige_pdf_segments.py
      - name: Preserve PDF validation evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gjensidige-official-source-diagnostics
          path: |
            data/gjensidige_pdf_diagnostics.json
          if-no-files-found: warn
