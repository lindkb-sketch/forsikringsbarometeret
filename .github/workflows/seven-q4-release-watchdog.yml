name: Nine-insurer rolling quarterly release coverage watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '24 8,16 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check_seven_q4_release_coverage.py'
      - 'scripts/check_nine_release.py'
      - 'scripts/nine_import_receipt.py'
      - 'tests/test_nine_release_automation.py'
      - 'tests/test_seven_q4_release_coverage.py'
      - '.github/workflows/seven-q4-release-watchdog.yml'
permissions:
  contents: read
jobs:
  check-q4-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all seven release conditions
        run: python -m unittest discover -s tests -p 'test_seven_q4_release_coverage.py' -v
      - name: Test all-nine rolling release and receipt conditions
        run: python -m unittest discover -s tests -p 'test_nine_release_automation.py' -v
      - name: Check scheduled releases and segment evidence
        run: python scripts/check_seven_q4_release_coverage.py
      - name: Check all nine actual comparison feeds including extended insurers
        if: ${{ !cancelled() }}
        run: python scripts/check_nine_release.py
