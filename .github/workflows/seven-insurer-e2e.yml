name: Seven-insurer end-to-end audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/e2e_seven_insurers.py'
      - 'tests/test_e2e_publication_state.py'
      - 'tests/test_future_year_discovery_contracts.py'
      - '.github/workflows/seven-insurer-e2e.yml'
  schedule:
    - cron: '15 9,14,19 * * *'
permissions:
  contents: read
concurrency:
  group: seven-insurer-readonly-audit
  cancel-in-progress: false
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install financial report dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Validate financial source and dashboard tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/audit_financials.py
          python scripts/verify_feed_coverage.py
      - name: Check all seven against Q3 reports, audited feed and public Pages
        run: python scripts/e2e_seven_insurers.py
      - name: Upload per-company audit even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-insurer-e2e-report
          path: data/e2e_seven_insurers.json
          if-no-files-found: warn
