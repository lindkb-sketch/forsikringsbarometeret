name: Backfill quarterly report commentary
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_report_commentary.py'
      - 'scripts/build_editorial.py'
      - 'scripts/generate_ai_quarterly_brief.py'
      - '.github/workflows/quarterly-commentary.yml'
  schedule:
    - cron: '25 3,9,15,21 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: quarterly-commentary-archive
  cancel-in-progress: false
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-PDF parser
        run: python -m pip install -r requirements-reports.txt
      - name: Verify narrative extraction safety
        run: python -m unittest discover -s tests -p 'test_quarterly_narrative_extraction.py' -v
      - name: Check four historical or newly published issuer PDFs and rebuild brief
        env:
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
        run: |
          QUARTER_COMMENTARY_BATCH=25 python scripts/refresh_report_commentary.py
          python scripts/generate_ai_quarterly_brief.py
          python scripts/build_editorial.py
          python scripts/check_quarterly_brief.py
      - name: Commit validated incremental backfill
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add data/quarterly_insights.json data/quarterly_editorial.json
            if git diff --cached --quiet; then
              echo 'No new verified narrative evidence'
              break
            fi
            git commit -m 'Backfill source-linked quarterly commentary'
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 4
          done
      - name: Deploy and verify latest official editorial data
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
      - name: Validate live narrative endpoint
        run: |
          python - <<'PY'
          import json,time,urllib.request
          url='https://lindkb-sketch.github.io/forsikringsbarometeret/data/quarterly_editorial.json'
          for i in range(7):
              request=urllib.request.Request(url+'?insightcheck='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:data=json.load(response)
                  assert data['brief'] and all(r['type']=='qualitative_quarter_theme' for r in data['brief'])
                  print('HISTORICAL_COMMENTARY_PUBLIC PASS',data['period'])
                  break
              except Exception as error:print('Waiting for page update',type(error).__name__)
              time.sleep(6)
          else:raise SystemExit('Public editorial still not verified')
          PY
      - name: Upload evidence coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-commentary-backfill
          path: data/quarterly_insights.json
          if-no-files-found: warn
