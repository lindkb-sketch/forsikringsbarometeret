name: Backfill quarterly report commentary
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forsikringsbarometeret-publish
  cancel-in-progress: false
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-PDF parser
        run: python -m pip install -r requirements-reports.txt
      - name: Verify narrative extraction safety
        run: python -m unittest discover -s tests -p 'test_quarterly_narrative_extraction.py' -v
      - name: Check four historical or newly published issuer PDFs and rebuild brief
        run: |
          QUARTER_COMMENTARY_BATCH=25 python scripts/refresh_report_commentary.py
          python scripts/build_editorial.py
          python scripts/build_strategic_market.py
          python scripts/check_quarterly_brief.py
