name: Market overview focused tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*market*'
      - 'tests/*market*'
      - '.github/workflows/market-overview-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install -r requirements-reports.txt
          python -m py_compile scripts/build_market_overview_segments.py scripts/fremtind_apm_market.py scripts/build_market_overview_context.py scripts/market_commentary_documents.py scripts/market_commentary_explanations.py scripts/market_profitability_history.py scripts/company_comparison_history.py tests/test_market_overview_segments.py
          python -m unittest discover -s tests -p 'test_fremtind_apm_market.py' -v
          python -m unittest discover -s tests -p 'test_market_overview_segments.py' -v
          python -m unittest discover -s tests -p 'test_market_overview_fx.py' -v
          node --check scripts/market_overview.js
          node --test tests/test_market_overview.cjs tests/test_market_overview_archive.cjs
      - name: Reconcile official live market-segment PDFs
        run: |
          python scripts/build_market_overview_segments.py
          python - <<'PY'
          import json
          data=json.load(open('data/market_overview_segments.json'))
          for c in ('Gjensidige','Fremtind','Alm. Brand'):
              assert data['status'].get(c,{}).get('status')=='verified', (c,data['status'])
          print('MARKET_FOCUSED_LIVE_OK',data['status'])
          PY
      - name: Verify complete quarter and HIÅ market snapshots
        run: |
          python scripts/build_market_overview_fx.py
          python scripts/build_market_overview_context.py
          node scripts/build_market_overview_archive.cjs --require-baseline
          node - <<'JS'
          const assert=require('node:assert/strict');
          const a=require('./data/market_overview_archive.json');
          const v=a.periods[a.active_period].views;
          const history=require('./scripts/market_overview.js').profitabilityHistory(require('./data/verified_financial_feed.json'),require('./data/market_overview_context.json'),a,v['group/all/quarter'].model.period);
          assert.equal(history.periods.length,5);
          assert.equal(history.series.length,9);
          const sam=require('./scripts/market_overview.js').sampoNordicSegments(require('./data/verified_financial_feed.json'),v['group/all/quarter'].model.period,'ytd');
          console.log('SAMPO_NORDIC_SEGMENTS',JSON.stringify(sam.map(r=>[r.segment,r.method,r.metrics])));
          if(a.active_period==='Q3 2026')assert.ok(sam.length===2&&sam.every(r=>r.metrics&&r.sources.length),'Both Sampo Nordic segments must have source-backed HIÅ figures');
          console.log('MARKET_HISTORY_COVERAGE',JSON.stringify(history.series.map(s=>[s.company,s.points.map(p=>p?.cr??null)])));
          if(a.active_period==='Q3 2026')assert.ok(history.series.every(s=>s.points.every(Boolean)),'Q3 baseline must include five verified quarterly CR values for all nine insurers');
          assert.equal(Object.keys(v).length,12);
          for(const [key,view] of Object.entries(v)){
            assert.deepEqual(view.comments.map(c=>c.label),['Inntektsvekst','CR – skade- og kostnadsprosent','Enkelthendelser og særtrekk']);
            const text=view.comments.flatMap(c=>c.paragraphs).join(' ');
            assert.doesNotMatch(text,/\b\d+\s*(?:av|\/)\s*\d+\s+selskaper|\bhøyest vekst|\bCR varierer fra .* hos/i,key);
          }
          const c=require('./data/market_overview_context.json');
          console.log('COMPANY_COMPARISON_HISTORICAL',JSON.stringify(c.company_comparisons?.observations?.map(r=>[r.company,r.year,r.quarter,r.period_type,r.metric,r.value])));
          console.log('EXTENDED_COMPARISON_COVERAGE',JSON.stringify(c.profitability_history?.points?.filter(r=>r.quarter===3).map(r=>[r.company,r.period,r.metrics,r.ytd_metrics])));
          assert.ok(c.insights.every(x=>['official_quarterly_report','official_results_presentation'].includes(x.source_type)&&x.source_document_period===x.period&&/^[0-9a-f]{64}$/.test(x.source_sha256)&&x.source_page>0));
          const decks=Object.entries(c.commentary_documents||{}).filter(([,d])=>d.presentation_status==='verified');
          assert.ok(decks.length>0,'At least one original quarterly results deck must be verified');
          const deckInsights=c.insights.filter(x=>x.source_type==='official_results_presentation');
          console.log('MARKET_COMMENTARY_DECKS',decks.map(([company,d])=>[company,d.documents.filter(x=>x.document_type==='results_presentation').length,d.insights.length]));
          console.log('MARKET_COMMENTARY_DECK_INSIGHTS',deckInsights.map(x=>[x.company,x.theme,x.driver,x.source_page,x.period_type]));
          for(const company of ['Fremtind','Gjensidige','Tryg','Sampo','Frende','Protector','Storebrand','KLP Skadeforsikring','Alm. Brand']){
            assert.equal(c.commentary_documents?.[company]?.report_verified,true,company+' current original report must be reviewed');
          }
          for(const company of ['Gjensidige','Tryg','Sampo','Alm. Brand','Protector','Storebrand']){
            assert.ok(deckInsights.some(x=>x.company===company&&['growth_driver','profit_driver','material_event','regulation'].includes(x.theme)),company+' results deck must actually contribute commentary evidence');
          }
          assert.ok(deckInsights.some(x=>x.theme==='growth_driver'),'Results presentations must contribute growth drivers');
          assert.ok(deckInsights.some(x=>x.theme==='profit_driver'),'Results presentations must contribute CR drivers');
          const drivers=c.insights.filter(x=>x.theme==='growth_driver');
          assert.ok(drivers.some(x=>x.driver==='price'&&x.company==='Fremtind'&&x.period_type==='quarter'&&x.views.includes('norway/pm')));
          assert.ok(drivers.some(x=>x.driver==='price'&&x.company==='Fremtind'&&x.period_type==='ytd'));
          assert.ok(drivers.some(x=>x.driver==='portfolio_growth'&&x.company==='Tryg'));
          assert.ok(drivers.some(x=>x.driver==='price'&&x.company==='Alm. Brand'));
          const explanations=c.insights.filter(x=>/_explanation$/.test(x.theme));
          for(const theme of ['growth_explanation','loss_explanation','cost_explanation','event_explanation']){
            assert.ok(explanations.some(x=>x.theme===theme),theme+' must contain substantive verified explanation');
          }
          for(const [key,view] of Object.entries(v)){
            const text=view.comments.map(x=>x.paragraphs.join(' '));
            assert.ok(text.every(x=>x.trim().length>0&&x.split(/\s+/).length<=125),key+' prose length');
            console.log('MARKET_COMMENTARY_QUALITY',key,JSON.stringify(view.comments));
          }
          console.log('MARKET_CAUSAL_EVIDENCE',JSON.stringify(explanations.map(x=>[x.company,x.theme,x.topic,x.period_type,x.source_page,x.views])));
          assert.ok(explanations.some(x=>x.company==='Fremtind'&&x.topic==='expense_reclassification'&&x.period_type==='quarter'));
          assert.ok(explanations.some(x=>x.topic==='workers_comp_provision'&&x.period_type==='ytd'&&x.text.includes('1,2 mrd.')));
          assert.ok(!explanations.some(x=>x.topic==='workers_comp_provision'&&x.period_type==='quarter'));
          assert.ok(explanations.some(x=>x.topic==='bm_large_loss'&&x.views.includes('norway/bm')));
          assert.ok(explanations.some(x=>x.topic==='pm_product_volumes'&&x.views.includes('norway/pm')));
          assert.ok(explanations.some(x=>x.topic==='workers_comp_adjusted'&&x.period_type==='ytd'));
          assert.match(v['group/bm/ytd'].comments[1].paragraphs.join(' '),/yrkesskadeavsetning/);
          assert.match(v['group/all/quarter'].comments[1].paragraphs.join(' '),/værskad|avvikling|reserver/);
          assert.match(v['norway/pm/ytd'].comments[2].paragraphs.join(' '),/13,9 %/);
          assert.doesNotMatch(v['group/all/quarter'].comments[0].paragraphs.join(' '),/Premiejusteringer er en sentral driver i den rapporterte porteføljen/);
          console.log('MARKET_TREND_COMMENTS_VERIFIED',Object.keys(v).length,drivers.map(d=>[d.company,d.driver,d.period_type,d.source_page]));
          JS
