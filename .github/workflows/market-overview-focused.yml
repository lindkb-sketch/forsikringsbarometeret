name: Market overview focused tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/*market*'
      - 'tests/*market*'
      - '.github/workflows/market-overview-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m pip install -r requirements-reports.txt
          python -m py_compile scripts/build_market_overview_segments.py scripts/fremtind_apm_market.py
          python -m unittest discover -s tests -p 'test_fremtind_apm_market.py' -v
          python -m unittest discover -s tests -p 'test_market_overview_segments.py' -v
          python -m unittest discover -s tests -p 'test_market_overview_fx.py' -v
          node --check scripts/market_overview.js
          node --test tests/test_market_overview.cjs tests/test_market_overview_archive.cjs
      - name: Reconcile official live market-segment PDFs
        run: |
          python scripts/build_market_overview_segments.py
          python - <<'PY'
          import json
          data=json.load(open('data/market_overview_segments.json'))
          for c in ('Gjensidige','Fremtind','Alm. Brand'):
              assert data['status'].get(c,{}).get('status')=='verified', (c,data['status'])
          print('MARKET_FOCUSED_LIVE_OK',data['status'])
          PY
      - name: Verify complete quarter and HIÅ market snapshots
        run: |
          python scripts/build_market_overview_fx.py
          python scripts/build_market_overview_context.py
          node scripts/build_market_overview_archive.cjs --require-baseline
          node - <<'JS'
          const assert=require('node:assert/strict');
          const a=require('./data/market_overview_archive.json');
          const v=a.periods[a.active_period].views;
          assert.equal(Object.keys(v).length,12);
          for(const [key,view] of Object.entries(v)){
            assert.deepEqual(view.comments.map(c=>c.label),['Inntektsvekst','CR – skade- og kostnadsprosent','Enkelthendelser og særtrekk']);
            const text=view.comments.flatMap(c=>c.paragraphs).join(' ');
            assert.doesNotMatch(text,/\b\d+\s*(?:av|\/)\s*\d+\s+selskaper|\bhøyest vekst|\bCR varierer fra .* hos/i,key);
          }
          const c=require('./data/market_overview_context.json');
          const drivers=c.insights.filter(x=>x.theme==='growth_driver');
          assert.ok(drivers.some(x=>x.driver==='price'&&x.company==='Fremtind'&&x.period_type==='quarter'&&x.views.includes('norway/pm')));
          assert.ok(drivers.some(x=>x.driver==='price'&&x.company==='Fremtind'&&x.period_type==='ytd'));
          assert.ok(drivers.some(x=>x.driver==='portfolio_growth'&&x.company==='Tryg'));
          assert.ok(drivers.some(x=>x.driver==='price'&&x.company==='Alm. Brand'));
          console.log('MARKET_TREND_COMMENTS_VERIFIED',Object.keys(v).length,drivers.map(d=>[d.company,d.driver,d.period_type,d.source_page]));
          JS
