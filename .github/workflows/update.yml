name: Kontroller og publiser finansdata og kalender
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: forsikringsbarometeret-publish
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Rebuild validated feed before regression tests
        run: python scripts/build_verified_feed.py
      - name: Identify exact code revision under validation
        run: |
          echo "Validating commit $(git rev-parse --short HEAD)"
          git status --short
      - name: Verify PDF-only Tryg import wiring
        run: python -m unittest discover -s tests -p 'test_tryg_pdf_only_wiring.py' -v
      - name: Fast PDF return parser preflight
        run: |
          python -m py_compile scripts/import_reported_returns.py scripts/import_fremtind_holding.py scripts/check_reported_returns_coverage.py
          python -m unittest discover -s tests -p 'test_reported_returns*.py' -v
      - name: Test dashboard and financial data
        run: |
          python -m unittest discover -s tests -v
          python tests/check_dashboard.py
          python scripts/audit_financials.py
          python -m json.tool data/financial_audit.json > /dev/null
      - name: Discover newly published official report files (diagnostic only)
        run: python scripts/discover_reports.py || echo "::warning::One or more official report indexes unavailable; no unverified data imported"
      - name: Check all seven companies future-quarter regression suite
        run: |
          python -m unittest discover -s tests -p 'test_future_insurers.py' -v
          python -m unittest discover -s tests -p 'test_sampo_future.py' -v
          python -m unittest discover -s tests -p 'test_protector_quarters.py' -v
          python -m unittest discover -s tests -p 'test_frende_fremtind_discovery.py' -v
          python -m unittest discover -s tests -p 'test_gjensidige_report_check.py' -v
          python -m unittest discover -s tests -p 'test_discover_reports.py' -v
      - name: Discover Frende Holding and Fremtind Holding official report candidates
        run: python scripts/discover_frende_fremtind.py || echo "::warning::Issuer archives unavailable; no unverified data imported"
      - name: Fetch independent editorial media headlines
        run: python scripts/ingest_media_news.py || echo "::warning::Media RSS unavailable; retaining last verified news feed"
      - name: Fetch delayed public stock quotes (independent of financial import)
        run: python scripts/update_stock_prices.py
      - name: Integrated quarterly pipeline (fail closed)
        run: python scripts/run_pipeline.py
      # Paid AI/API editorial is intentionally disabled. Use verified free source-based strategy generation only.
      - name: Require current qualitative quarterly brief
        run: python scripts/check_quarterly_brief.py
      - name: Verify all seven insurers reach generated website feed
        run: python scripts/verify_feed_coverage.py
      - name: Enforce uniform automatic quarterly financial import for all seven insurers
        run: python scripts/quarterly_import_contract.py
      - name: Audit prior-year growth evidence for all seven insurers
        run: python scripts/prior_year_growth_coverage.py
      - name: Generate coverage after validated quarterly imports
        run: python scripts/report_coverage.py
      - name: Audit rolling profitability history and year boundaries
        run: python scripts/audit_profitability_history.py
      - name: Verify source-to-feed provenance for seven insurers
        run: python scripts/publication_provenance.py
      - name: Build investor readiness manifest (fail closed on missing evidence)
        run: python scripts/investor_readiness.py
      - name: Prepare preinstalled Google Chrome browser automation
        run: |
          npm install --no-save playwright
          google-chrome --version
      - name: Verify rendered local site before publishing
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/forsikringsbarometeret-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          BAROMETER_URL=http://127.0.0.1:8765/ node tests/live_browser_e2e.cjs
      - name: Report validation and publication diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path("data")
          lines=["## Forsikringsbarometeret – datakontroll"]
          for filename in ("financial_audit.json", "report_coverage.json", "investor_readiness.json"):
              path=root/filename
              if not path.exists():
                  lines.append(f"- {filename}: ingen oppdatert fil (se jobblogg)")
                  continue
              try:
                  data=json.loads(path.read_text(encoding="utf-8"))
                  if filename=="financial_audit.json":
                      lines.append(f"- Kildekontroll: {'OK' if data.get('ok') else 'FEIL'}; feil: {len(data.get('errors', []))}; advarsler: {len(data.get('warnings', []))}")
                  elif filename=="report_coverage.json":
                      lines.append(f"- Alle syv automatisk verifisert: {data.get('all_seven_automatic', False)}")
                  else:
                      lines.append(f"- Investorstatus: {data.get('status', 'ikke bekreftet')}")
              except (OSError, ValueError) as exc:
                  lines.append(f"- {filename}: kunne ikke leses: {type(exc).__name__}")
          coverage_path=root/"report_coverage.json"
          if coverage_path.exists():
              try:
                  coverage=json.loads(coverage_path.read_text(encoding="utf-8"))
                  lines.extend(["", "### Status per forsikringsselskap", "", "| Selskap | Siste komplette gruppekvartal | Automatisk ende-til-ende |", "| --- | --- | --- |"])
                  for company in coverage.get("companies", []):
                      periods=company.get("group_quarters_with_required_metrics") or []
                      latest=max(periods) if periods else "Mangler"
                      verified="Ja" if company.get("automatic_complete") is True else "Ikke dokumentert"
                      lines.append(f"| {company.get('company', 'Ukjent')} | {latest} | {verified} |")
                  if coverage.get("all_seven_automatic") is not True:
                      lines.append("")
                      lines.append("**Merk:** Grønn CI betyr ikke at full automatisk rapportimport er bevist for alle sju selskapene.")
              except (OSError, ValueError, TypeError) as exc:
                  lines.append(f"- Dekningsdetaljer kunne ikke leses: {type(exc).__name__}")
          lines.append("- Rapporter som ennå ikke er offentliggjort, er forventet og skal ikke erstattes med beregnede verdier.")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n".join(lines)+"\n")
          PY
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-pipeline-diagnostics
          path: data/financial_audit.json
      - name: Refuse stale generated-data publication
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Main advanced while this run was validating. Refusing stale data overwrite."
            exit 1
          fi
      - name: Commit generated financial feed and calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/live.json data/financial_audit.json data/verified_financial_feed.json data/financial_observations.json data/geographic_import_status.json data/quarterly_editorial.json data/quarterly_insights.json data/strategic_market.json data/official_news.json data/stock_prices.json data/report_candidates.json data/report_coverage.json data/prior_year_growth_coverage.json data/profitability_coverage.json data/publication_provenance.json data/investor_readiness.json data/frende_fremtind_candidates.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            # Stage only generated data against newest main; a soft reset would also stage\n            # newer workflow/code changes that this token cannot push.\n            # Generated files are the output of this validated run. Never rebase a
            # generated-data commit across a newer generated-data commit: it
            # creates deterministic JSON conflicts and blocks Pages deployment.
            for attempt in 1 2 3; do
              git fetch origin main
              if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
                echo "::error::Main changed after validation. Refusing outdated generated data."
                exit 1
              fi
              git reset --mixed origin/main
              for file in data/live.json data/financial_audit.json data/verified_financial_feed.json data/financial_observations.json data/geographic_import_status.json data/quarterly_editorial.json data/quarterly_insights.json data/strategic_market.json data/official_news.json data/stock_prices.json data/report_candidates.json data/report_coverage.json data/prior_year_growth_coverage.json data/profitability_coverage.json data/publication_provenance.json data/investor_readiness.json data/frende_fremtind_candidates.json; do
                if [ -f "$file" ]; then git add -- "$file"; fi
              done
              if git diff --cached --quiet; then
                echo 'Validated artifacts already current'
                break
              fi
              git commit -m 'Update verified financial feed and report calendar'
              if git push origin HEAD:main; then
                echo 'Published validated artifacts'
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo '::error::Could not publish validated feed after three attempts'
                exit 1
              fi
              sleep 5
            done
          fi
      - name: Refresh deployment tree from published main
        run: |
          # The workflow may have started before newer UI commits. Deploy the
          # actual latest main HTML and the exact JSON committed above.
          git fetch origin main
          git reset --hard origin/main
      - name: Confirm complete static site and source feeds before packaging
        run: python scripts/verify_deployment_tree.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify actual public finance, news, stock and editorial JSON
        run: python scripts/verify_public_pages.py
      - name: Verify rendered homepage, Q3, HIÅ, arrows, news, quotes and brief
        run: node tests/live_browser_e2e.cjs
      - name: Save browser screenshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-homepage-e2e
          path: |
            data/browser_home_q3.png
            data/browser_home_ytd.png
            data/browser_e2e_report.json
          if-no-files-found: warn
