name: Kontroller og publiser kalender
on:
  schedule:
    - cron: '17 5,11,16,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: konkurrentmonitor-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and update calendar
        run: |
          python -m unittest discover -s tests -v
          python scripts/update.py
      - name: Commit changed calendar
        run: |
          if ! git diff --quiet -- data/live.json; then
            git config user.name 'konkurrentmonitor-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/live.json
            git commit -m 'Update report calendar state'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
        environment:
          name: github-pages
