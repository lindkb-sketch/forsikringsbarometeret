name: Kontroller og publiser finansdata og kalender
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: forsikringsbarometeret-publish-v2
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Rebuild validated feed before regression tests
        run: python scripts/build_verified_feed.py
      - name: Test dashboard and financial data
        run: |
          python -m unittest discover -s tests -v
          python tests/check_dashboard.py
          python scripts/audit_financials.py
          python -m json.tool data/financial_audit.json > /dev/null
      - name: Discover newly published official report files (diagnostic only)
        run: python scripts/discover_reports.py || echo "::warning::One or more official report indexes unavailable; no unverified data imported"
      - name: Check all seven companies future-quarter regression suite
        run: |
          python -m unittest discover -s tests -p 'test_future_insurers.py' -v
          python -m unittest discover -s tests -p 'test_sampo_future.py' -v
          python -m unittest discover -s tests -p 'test_protector_quarters.py' -v
          python -m unittest discover -s tests -p 'test_frende_fremtind_discovery.py' -v
          python -m unittest discover -s tests -p 'test_gjensidige_report_check.py' -v
          python -m unittest discover -s tests -p 'test_discover_reports.py' -v
      - name: Discover Frende Holding and Fremtind Holding official report candidates
        run: python scripts/discover_frende_fremtind.py || echo "::warning::Issuer archives unavailable; no unverified data imported"
      - name: Fetch independent editorial media headlines
        run: python scripts/ingest_media_news.py || echo "::warning::Media RSS unavailable; retaining last verified news feed"
      - name: Fetch delayed public stock quotes (independent of financial import)
        run: python scripts/update_stock_prices.py
      - name: Integrated quarterly pipeline (fail closed)
        run: python scripts/run_pipeline.py
      - name: Verify all seven insurers reach generated website feed
        run: python scripts/verify_feed_coverage.py
      - name: Generate coverage after validated quarterly imports
        run: python scripts/report_coverage.py
      - name: Prepare preinstalled Google Chrome browser automation
        run: |
          npm install --no-save playwright
          google-chrome --version
      - name: Verify rendered local site before publishing
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/forsikringsbarometeret-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          BAROMETER_URL=http://127.0.0.1:8765/ node tests/live_browser_e2e.cjs
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-pipeline-diagnostics
          path: data/financial_audit.json
      - name: Commit generated financial feed and calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/live.json data/financial_audit.json data/verified_financial_feed.json data/financial_observations.json data/geographic_import_status.json data/quarterly_editorial.json data/official_news.json data/stock_prices.json data/report_candidates.json data/report_coverage.json data/frende_fremtind_candidates.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            # Stage only generated data against newest main; a soft reset would also stage\n            # newer workflow/code changes that this token cannot push.\n            # Generated files are the output of this validated run. Never rebase a
            # generated-data commit across a newer generated-data commit: it
            # creates deterministic JSON conflicts and blocks Pages deployment.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --mixed origin/main
              for file in data/live.json data/financial_audit.json data/verified_financial_feed.json data/financial_observations.json data/geographic_import_status.json data/quarterly_editorial.json data/official_news.json data/stock_prices.json data/report_candidates.json data/report_coverage.json data/frende_fremtind_candidates.json; do
                if [ -f "$file" ]; then git add -- "$file"; fi
              done
              if git diff --cached --quiet; then
                echo 'Validated artifacts already current'
                break
              fi
              git commit -m 'Update verified financial feed and report calendar'
              if git push origin HEAD:main; then
                echo 'Published validated artifacts'
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo '::error::Could not publish validated feed after three attempts'
                exit 1
              fi
              sleep 5
            done
          fi
      - name: Refresh deployment tree from published main
        run: |
          # The workflow may have started before newer UI commits. Deploy the
          # actual latest main HTML and the exact JSON committed above.
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify actual public finance, news, stock and editorial JSON
        run: python scripts/verify_public_pages.py
      - name: Verify rendered homepage, Q3, HIÅ, arrows, news, quotes and brief
        run: node tests/live_browser_e2e.cjs
      - name: Save browser screenshots and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-homepage-e2e
          path: |
            data/browser_home_q3.png
            data/browser_home_ytd.png
            data/browser_e2e_report.json
          if-no-files-found: warn
