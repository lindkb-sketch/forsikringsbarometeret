name: Pull request regression tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Compile importers and discovery
        run: python -m compileall -q scripts tests
      - name: Run full unit regression suite
        run: python -m unittest discover -s tests -v
      - name: Audit committed financial observations
        run: python scripts/audit_financials.py
      - name: Validate dashboard
        run: python tests/check_dashboard.py
      - name: Live issuer discovery (no publication)
        run: python scripts/discover_frende_fremtind.py
      - name: Live Fremtind Holding PDF import and audit (no publication)
        run: |
          python scripts/import_fremtind_holding.py
          python scripts/audit_financials.py
      - name: Live Frende Holding publisher import and audit (no publication)
        run: |
          python scripts/import_frende_holding.py
          python scripts/audit_financials.py
      - name: Show verified Fremtind and Frende quarterly coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/financial_observations.json').read_text())['observations']
          for company in ('Fremtind','Frende'):
              for year in (2025,2026):
                  periods=sorted({(r['quarter'],r['period_type']) for r in rows if r['company']==company and r['year']==year and r['metric']=='insurance_revenue'})
                  print(f'{company} {year}: {periods}',flush=True)
          PY
      - name: Diagnose remaining 2025 Frende format variants
        run: |
          python - <<'PY'
          import sys,re
          sys.path.insert(0,'scripts')
          from import_frende_holding import read,TableReader
          for q in (2,3,4):
              root=f'https://frende.wrep.it/q{q}-2025-frende-holding-as'
              for sec in (6,7):
                  try:
                      html=read(root,sec);p=TableReader();p.feed(html)
                      print('FORMAT',q,sec,'HEADERS',[r[:7] for r in p.rows[:2]],'MATCHING_ROWS',[r[:3] for r in p.rows if r and re.search('Combined ratio|Kostnads|Skadeprosent|driftsinntekter|Resultat før skatt',r[0],re.I)][:12])
                  except Exception as exc:print('FORMAT_ERROR',q,sec,repr(exc))
          PY
