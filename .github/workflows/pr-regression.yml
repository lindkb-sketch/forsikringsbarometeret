name: Pull request regression tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-reports.txt
      - name: Fast quarterly-summary preflight (fail before expensive live imports)
        run: |
          python -m unittest discover -s tests -p 'test_verified_dashboard.py' -v
          python -m py_compile scripts/build_editorial.py
          node --check tests/live_browser_e2e.cjs
      - name: Install test dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Compile importers and discovery
        run: python -m compileall -q scripts tests
      - name: Import official Sampo source for regression (not published)
        run: python scripts/sampo_publish.py
      - name: Run full unit regression suite
        run: python -m unittest discover -s tests -v
      - name: Prove Q3 2024 Gjensidige comparatives from issuer PDF
        run: python scripts/verify_gjensidige_2024_q3.py
      - name: Live official Storebrand Q3 2025 Insurance supplement backfill check
        run: |
          python scripts/storebrand_2024_official_backfill.py
          python scripts/audit_financials.py
      - name: Verify live Protector Q3 2025 official PDF Q3/YTD 2024 comparators
        run: |
          python scripts/protector_2024_official_backfill.py
          python scripts/audit_financials.py
      - name: Audit committed financial observations
        run: python scripts/audit_financials.py
      - name: Validate dashboard
        run: python tests/check_dashboard.py
      - name: Live issuer discovery (no publication)
        run: python scripts/discover_frende_fremtind.py
      - name: Live Fremtind Holding PDF import and audit (no publication)
        run: |
          python scripts/import_fremtind_holding.py
          python scripts/audit_financials.py
      - name: Live Frende Holding publisher import and audit (no publication)
        run: |
          python scripts/import_frende_holding.py
          python scripts/audit_financials.py
      - name: Require official Fremtind 2024 Q3 comparative after historical import
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/financial_observations.json').read_text())['observations']
          for period in ('quarter','ytd'):
              samples=[r for r in rows if r.get('company')=='Fremtind'
                       and r.get('year')==2024 and r.get('quarter')==3
                       and r.get('scope')=='group' and r.get('period_type')==period
                       and r.get('metric')=='insurance_revenue'
                       and str(r.get('source_url','')).startswith('https://')]
              if len(samples)!=1:
                  raise AssertionError(f'Fremtind 2024 Q3 {period}: expected one official comparable, found {len(samples)}')
              print('FREMTIND_2024_SOURCE_PASS',period,samples[0]['value'],samples[0]['source_url'])
          PY
      - name: Show verified Fremtind and Frende quarterly coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/financial_observations.json').read_text())['observations']
          for company in ('Fremtind','Frende'):
              for year in (2025,2026):
                  periods=sorted({(r['quarter'],r['period_type']) for r in rows if r['company']==company and r['year']==year and r['metric']=='insurance_revenue'})
                  print(f'{company} {year}: {periods}',flush=True)
          PY
      - name: Build verified feed and coverage after both live imports
        run: |
          python scripts/build_verified_feed.py
          python scripts/verify_feed_coverage.py
          python scripts/report_coverage.py
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/financial_observations.json').read_text())['observations']
          for company,periods in {'Frende':{(2025,1),(2025,2),(2025,3),(2025,4),(2026,1),(2026,2)},'Fremtind':{(2026,1),(2026,2),(2026,3)}}.items():
              present={(r['year'],r['quarter']) for r in rows if r['company']==company and r.get('scope')=='group'}
              missing=periods-present
              if missing:raise AssertionError(f'{company}: missing verified quarters {missing}')
              print(company,'verified',sorted(periods))
          PY
      - name: Discover live official Tryg PDF reports
        run: python scripts/discover_tryg.py
      - name: Live Tryg PDF group and Norway PDF end-to-end import
        run: |
          python scripts/import_tryg.py
          python scripts/audit_financials.py
          python scripts/verify_feed_coverage.py
      - name: Audit Tryg PDF-only group and Norway automation readiness
        run: python scripts/verify_tryg_end_to_end.py
      - name: Build final website data for browser regression
        run: |
          python scripts/build_verified_feed.py
          python scripts/build_editorial.py
          python scripts/update.py
          python scripts/verify_feed_coverage.py
          python scripts/report_coverage.py
          python scripts/investor_readiness.py
      - name: Prepare Chrome browser regression dependencies
        run: |
          npm install --no-save playwright
          google-chrome --version
      - name: Verify actual rendered PR site locally (before merge)
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/forsikringsbarometeret-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          BAROMETER_URL=http://127.0.0.1:8765/ node tests/live_browser_e2e.cjs
          BAROMETER_URL=http://127.0.0.1:8765/ node tests/seven_company_detail_browser.cjs
      - name: Upload local browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-local-browser-audit
          path: |
            data/browser_e2e_report.json
            data/browser_home_q3.png
            data/browser_home_ytd.png
          if-no-files-found: warn
      - name: Check currently published GitHub Pages for seven insurers (diagnostic; PR is not deployed)
        continue-on-error: true
        run: PAGES_VERIFY_ATTEMPTS=1 python scripts/verify_public_pages.py
      - name: Inspect official Tryg 2026 PDF archive links
        run: |
          python - <<'PY'
          import urllib.request,re
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.a=None;self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':self.a=[dict(attrs).get('href',''),[]]
              def handle_data(self,data):
                  if self.a:self.a[1].append(data)
              def handle_endtag(self,tag):
                  if tag=='a' and self.a:self.links.append((self.a[0],' '.join(self.a[1]).strip()));self.a=None
          req=urllib.request.Request('https://tryg.com/en/downloads-2026',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:markup=r.read(1500000).decode('utf-8','replace')
          parser=Links();parser.feed(markup)
          print('LINK_COUNT',len(parser.links))
          for url,label in parser.links:
              if re.search(r'Q[123]|Interim report|Investor tables',url+' '+label,re.I) and '.pdf' in url.lower():
                  print('TRYG_LINK',repr(label[:110]),repr(url[:320]))
          PY
      - name: Inspect official Tryg PDF group and Norway source schemas
        run: |
          python - <<'PY'
          import json,io,urllib.request
          import pdfplumber
          from pathlib import Path
          pairs=json.loads(Path('data/tryg_candidates.json').read_text())['pairs']
          for pair in pairs:
              if pair['year']!=2026 or pair['quarter']!=3:continue
              url=pair['report_pdf_url']
              print('TRYG_Q3_PDF',url)
              req=urllib.request.Request(url,headers={'User-Agent':'Forsikringsbarometeret/1.0'})
              with urllib.request.urlopen(req,timeout=40) as response:blob=response.read(35_000_001)
              if len(blob)>35_000_000 or not blob.startswith(b'%PDF-'):raise ValueError('Invalid official PDF')
              with pdfplumber.open(io.BytesIO(blob)) as pdf:
                  for i,page in enumerate(pdf.pages[:15]):
                      lines=(page.extract_text() or '').splitlines()
                      if any('insurance revenue' in line.lower() for line in lines):
                          print('PDF_PAGE',i+1,'ROWS',lines[:12])
          PY
