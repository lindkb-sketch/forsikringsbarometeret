name: Pull request regression tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Compile importers and discovery
        run: python -m compileall -q scripts tests
      - name: Run full unit regression suite
        run: python -m unittest discover -s tests -v
      - name: Audit committed financial observations
        run: python scripts/audit_financials.py
      - name: Validate dashboard
        run: python tests/check_dashboard.py
      - name: Live issuer discovery (no publication)
        run: python scripts/discover_frende_fremtind.py
      - name: Live Fremtind Holding PDF import and audit (no publication)
        run: |
          python scripts/import_fremtind_holding.py
          python scripts/audit_financials.py
      - name: Show verified Fremtind and Frende quarterly coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/financial_observations.json').read_text())['observations']
          for company in ('Fremtind','Frende'):
              for year in (2025,2026):
                  periods=sorted({(r['quarter'],r['period_type']) for r in rows if r['company']==company and r['year']==year and r['metric']=='insurance_revenue'})
                  print(f'{company} {year}: {periods}',flush=True)
          PY
      - name: Inspect Frende publisher structure (no financial publication)
        run: |
          python - <<'PY'
          import urllib.request,re,html
          from html.parser import HTMLParser
          url='https://frende.wrep.it/q2-2026-frende-holding-as'
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  content=response.read(800000).decode('utf-8','replace')
                  print('FINAL_URL',response.geturl(),'HTML_BYTES',len(content))
              for pattern in (r'<title[^>]*>(.*?)</title>',r'<iframe[^>]+>',r'<embed[^>]+>',r'<a[^>]+href=["\\\']([^"\\\']+)',r'.{0,120}(?:Forsikringsinntekter|forsikringsinntekter|Skadeprosent|combined ratio|pdf).{0,180}'):
                  matches=re.findall(pattern,content,re.I|re.S)
                  print('PATTERN',pattern,'MATCHES',len(matches))
                  for match in matches[:12]:print('EXCERPT',html.unescape(str(match))[:350].replace('\\n',' '))
          except Exception as exc:
              print('FETCH_ERROR',type(exc).__name__,str(exc))
          PY
      - name: Inspect Frende publisher embedded financial table structure
        run: |
          python - <<'PY'
          import urllib.request,re,html
          from html.parser import HTMLParser
          root='https://frende.wrep.it/q2-2026-frende-holding-as'
          class Text(HTMLParser):
              def __init__(self):super().__init__();self.parts=[]
              def handle_data(self,s):self.parts.append(s)
          for suffix in ('/sec/2','/sec/3','/sec/4','/sec/5','/sec/6','/sec/7','/sec/8','/sec/9'):
              url=root+suffix
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as resp:markup=resp.read(900000).decode('utf-8','replace')
                  parser=Text();parser.feed(markup)
                  clean=' '.join(' '.join(parser.parts).split())
                  print('SECTION',suffix,'LENGTH',len(clean),'TABLES',len(re.findall(r'<table',markup,re.I)),'TEXT',clean[:550])
                  for term in ('forsikringsinntekter','forsikringsresultat','skadeprosent','kostnadsprosent','combined ratio','premieinntekter'):
                      m=re.search(term,clean,re.I)
                      if m:print('MATCH',term,clean[max(0,m.start()-120):m.end()+260])
              except Exception as exc:print('SECTION_ERROR',suffix,type(exc).__name__,str(exc))
          PY
