name: Frende Skade quarterly report parser validation
on:
  push:
    branches: [feat/frende-skade-verified-quarter-import-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install -r requirements-reports.txt
      - name: Validate official subsidiary report HTML and independent importer
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          from import_frende_skade import read_section, verify_period, build, REPORTS
          from import_frende_holding import TableReader
          import json
          for q in (1,2,3):
              url=f'https://frende.wrep.it/q{q}-2026-frende-skadeforsikring-as'
              for sec in (6,7):
                  try:
                      html=read_section(url,sec)
                      reader=TableReader();reader.feed(html)
                      print('SECTION',q,sec,'entity',('Frende Skadeforsikring' in html),'rows',len(reader.rows),flush=True)
                      for row in reader.rows:print('ROW',q,sec,repr(row[:6]),flush=True)
                  except Exception as exc:print('SECTION_ERROR',q,sec,repr(exc),flush=True)
              try:
                  rows=verify_period(url,2026,q)
                  print('QUARTER_VERIFIED',q,len(rows),flush=True)
              except Exception as exc:print('QUARTER_ERROR',q,repr(exc),flush=True)
          import urllib.request
          from discover_frende_skade_reports import ARCHIVE,Links
          with urllib.request.urlopen(urllib.request.Request(ARCHIVE,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as resp:
              markup=resp.read(3_000_000).decode('utf-8','replace')
          p=Links();p.feed(markup)
          for href,label in p.links:
              if ('Skadeforsikring' in label or '.pdf' in href.lower() or '2026' in label):
                  print('ARCHIVE_LINK',repr(label[:120]),repr(href[:240]),flush=True)
          import urllib.request, re
          from html.parser import HTMLParser
          class A(HTMLParser):
              def __init__(self):super().__init__();self.href=None;self.caption='';self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':self.href=dict(attrs).get('href');self.caption=''
              def handle_data(self,d):
                  if self.href is not None:self.caption+=d
              def handle_endtag(self,tag):
                  if tag=='a' and self.href is not None:self.links.append((self.caption.strip(),self.href));self.href=None
          for url in ('https://newsweb.oslobors.no/message/684953',
                      'https://newsweb.oslobors.no/message/671905',
                      'https://live.euronext.com/en/listview/company-press-release/600963'):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as res:
                      html=res.read(3_000_000).decode('utf-8','replace')
                  for phrase in ('Frende Forsikring 3. kvartal 2026','Frende Forsikring 2. kvartal 2026'):
                      pos=html.find(phrase)
                      if pos!=-1: print('EURONEXT_CONTEXT',phrase,repr(html[max(0,pos-650):pos+450]),flush=True)
                  p=A();p.feed(html)
                  print('LOOKUP',url,'links',len(p.links),flush=True)
                  for label,href in p.links:
                      if re.search('pdf|frende|quarter|kvartal',label+' '+href,re.I):
                          print('LINK',repr(label[:90]),repr(href[:350]),flush=True)
              except Exception as e:print('LOOKUP_ERROR',url,str(e)[:200],flush=True)
          for url in (
              'https://live.euronext.com/nb/products/equities/company-news/2026-10-28-frende-forsikring-3-kvartal-2026',
              'https://live.euronext.com/en/node/12919046',
              'https://live.euronext.com/node/12919046',
              'https://live.euronext.com/nb/products/equities/company-news/2026-08-11-frende-forsikring-2-kvartal-2026',
              'https://live.euronext.com/en/node/12903959',
              'https://live.euronext.com/sites/default/files/company_press_releases/attachments_oslo/2026/10/28/684953_Frende%20Skadeforsikring%20AS%20Q3%202026.pdf'
          ):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as res:
                      chunk=res.read(120000)
                      print('PROBE',res.status,res.geturl(),res.headers.get('Content-Type'),len(chunk),flush=True)
                      if b'pdf' not in str(res.headers.get('Content-Type','')).lower().encode():
                          p=A();p.feed(chunk.decode('utf-8','replace'))
                          for label,href in p.links:
                              if '.pdf' in (label+' '+href).lower():print('PDFLINK',repr(label[:70]),repr(href[:250]),flush=True)
              except Exception as e:print('PROBE_ERROR',url,str(e)[:200],flush=True)
          import pdfplumber,io
          for url in ('https://live.euronext.com/en/node/12903959','https://live.euronext.com/en/node/12919046'):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as res:
                      body=res.read(4_000_000).decode('utf-8','replace')
                  matches=re.findall(r'''(?:href=["']([^"']+\.pdf[^"']*)["']|/sites/default/files/company_press_releases/attachments_oslo/[^"\s<>]+)''',body,re.I)
                  print('NODE',url,'size',len(body),'pdf_matches',matches[:12],flush=True)
                  for piece in ('Frende Skadeforsikring AS Q2','Frende Forsikring 2. kvartal','message/'):
                      p=body.find(piece)
                      if p>=0:print('NODE_CONTEXT',piece,repr(body[max(0,p-300):p+300]),flush=True)
              except Exception as exc:print('NODE_ERROR',url,repr(exc),flush=True)
          for q,url in ((1,'https://live.euronext.com/sites/default/files/company_press_releases/attachments_oslo/2026/04/29/671905_Frende%20Forsikring%201.%20kvartal%202026.pdf'),
                        (3,'https://live.euronext.com/sites/default/files/company_press_releases/attachments_oslo/2026/10/28/684953_Frende%20Skadeforsikring%20AS%20Q3%202026.pdf')):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=35) as response:
                      blob=response.read(28_000_000)
                  with pdfplumber.open(io.BytesIO(blob)) as pdf:
                      print('PDF_DOC',q,len(pdf.pages),len(blob),flush=True)
                      for n,page in enumerate(pdf.pages):
                          txt=page.extract_text() or ''
                          if 'Frende Skadeforsikring AS' in txt and ('Resultatregnskap' in txt or 'Nøkkelinformasjon' in txt):
                              print('PDF_PAGE',q,n+1,repr(txt[:1800]),flush=True)
              except Exception as exc:print('PDF_ERROR',q,repr(exc),flush=True)
          result=build(json.loads(REPORTS.read_text()))
          print('VERIFIED_ROWS',len(result['observations']),'ISSUES',result['diagnostics'][:5],flush=True)
          PY
