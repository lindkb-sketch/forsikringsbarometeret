name: Frende Skade PDF parser validation
on:
  push:
    branches: [feat/frende-skade-verified-quarter-import-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pdfplumber
      - name: Inspect official original PDF layout for each quarter
        run: |
          python - <<'PY'
          import io,json,urllib.request,pdfplumber
          from pathlib import Path
          index=json.loads(Path('data/frende_skade_reports.json').read_text())
          for item in index['reports']:
              if item['year']!=2026 or 'pdf_url' not in item:continue
              q=item['quarter']
              req=urllib.request.Request(item['pdf_url'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=40) as r:blob=r.read(30_000_000)
              assert blob.startswith(b'%PDF-')
              with pdfplumber.open(io.BytesIO(blob)) as pdf:
                  print('PDF_VERIFIED',q,len(blob),len(pdf.pages),flush=True)
                  for n,page in enumerate(pdf.pages):
                      txt=page.extract_text(layout=True) or ''
                      if 'Premieinntekter for egen regning' in txt and ('Resultatregnskap' in txt or 'Nøkkelinformasjon' in txt):
                          print('PDF_TARGET_PAGE',q,n+1,flush=True)
                          print('PDF_CONTENT',q,n+1,repr(txt[:6500]),flush=True)
                          tables=page.extract_tables()
                          for t in tables[:2]:print('PDF_TABLE',q,n+1,repr(t[:12]),flush=True)
          PY
