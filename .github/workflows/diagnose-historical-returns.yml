name: Diagnose remaining historical return PDFs
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose_remaining_returns.py'
      - 'scripts/replay_historical_return_tables.py'
      - 'tests/test_replay_historical_return_tables.py'
      - '.github/workflows/diagnose-historical-returns.yml'
permissions:
  contents: read
jobs:
  inspect-original-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parsing dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Inspect five issuer-fingerprinted PDF source pages
        run: python scripts/diagnose_remaining_returns.py
      - name: Upload bounded source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-historical-returns-diagnostics
          path: data/remaining_return_source_diagnostics.json
          if-no-files-found: warn
