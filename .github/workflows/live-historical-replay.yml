name: Live historical seven-insurer import replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/live_historical_replay.py'
      - '.github/workflows/live-historical-replay.yml'
      - 'tests/test_full_automation_stress.py'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: python -m pip install -r requirements-reports.txt
      - name: Attempt real report discovery and imports in isolation
        run: python scripts/live_historical_replay.py
      - name: Summarize actual historical recovery and certification
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path('data/live_historical_replay.json')
          if not path.exists():
              print('Replay report missing')
              raise SystemExit(1)
          report=json.loads(path.read_text())
          rows=report['results']
          total=sum(x['historical_rows_recovered'] for x in rows)
          expected=sum(x['historical_rows_expected'] for x in rows)
          lines=['## Historical issuer replay',f'**Recovered: {total}/{expected}. Full certification: {report["full_seven_certified"]}.**','','| Company | Recovered | Missing | Certified |','|---|---:|---:|---|']
          for x in rows:
              lines.append(f'| {x["company"]} | {x["historical_rows_recovered"]}/{x["historical_rows_expected"]} | {x["historical_rows_missing"]} | {x["clean_replay_certified"]} |')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:summary.write('\\n'.join(lines)+'\\n')
          if not report['full_seven_certified']:
              print('::warning::Historical replay is INCOMPLETE; zero exit status does not certify all issuers.')
          PY
      - name: Verify clean replay restoration, idempotence and publication safeguards
        run: python -m unittest tests/test_full_automation_stress.py -v
      - name: Simulate malformed report and invalid observation rejection
        run: python -m unittest tests/test_final_failure_simulations.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local browser test runner
        run: npm install --no-save playwright
      - name: Check local rendered site against audited production feed
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/fb-final-browser.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          BAROMETER_URL=http://127.0.0.1:8765/ node tests/live_browser_e2e.cjs
      - name: Validate genuinely reconstructed data in an isolated browser
        run: |
          if [ ! -f data/replay_only_verified_feed.json ]; then
            echo "::warning::Strict replay feed could not be built; inspect per-company missing data in replay evidence"
          else
            stage="$(mktemp -d)"
            cp -a index.html scripts data "$stage"/
            cp data/replay_only_verified_feed.json "$stage/data/verified_financial_feed.json"
            python -m http.server 8766 --bind 127.0.0.1 --directory "$stage" >/tmp/fb-replayed-browser.log 2>&1 &
            pid=$!
            trap 'kill "$pid" 2>/dev/null || true' EXIT
            sleep 2
            BAROMETER_URL=http://127.0.0.1:8766/ node tests/live_browser_e2e.cjs
          fi
      - name: Archive per-issuer successes and blocked steps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-historical-import-replay
          path: |
            data/live_historical_replay.json
            data/replay_only_verified_feed.json
            data/tryg_historical_diagnostics.json
            data/storebrand_roe_diagnostics.json
          if-no-files-found: warn
