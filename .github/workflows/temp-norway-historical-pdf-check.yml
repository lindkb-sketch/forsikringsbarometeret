name: Validate historical Frende and Protector Norway PDF revenue
on:
  push:
    branches: [fix/norway-frende-protector-yoy-growth-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pdfplumber
      - name: Inspect source-verified prior-year Norway revenue
        run: |
          python - <<'PY'
          import sys,io,urllib.request,pdfplumber,json
          sys.path.insert(0,'scripts')
          from import_frende_skade import verify_pdf,verify_legacy_2024_revenue,download_pdf
          sources=json.load(open('data/frende_skade_reports.json'))['reports']
          for quarter in (1,2,3):
              row=next(r for r in sources if (r['year'],r['quarter'])==(2024,quarter))
              try:
                  blob=download_pdf(row['pdf_url'])
                  rows=verify_legacy_2024_revenue(blob,row['pdf_url'],quarter)
                  print('FRENDE2024',quarter,[(r['year'],r['period_type'],r['metric'],r['value']) for r in rows],flush=True)
              except Exception as exc:
                  print('FRENDE2024_ERROR',quarter,type(exc).__name__,str(exc)[:300],flush=True)
                  try:
                      with urllib.request.urlopen(row['pdf_url'],timeout=20) as response:blob=response.read(10_000_000)
                      with pdfplumber.open(io.BytesIO(blob)) as pdf:
                          for i,page in enumerate(pdf.pages):
                              content=page.extract_text(layout=False) or ''
                              if 'Premieinntekter for egen regning' in content and 'Teknisk regnskap for skadeforsikring' in content:
                                  print('FRENDE2024_PDF_PAGE',quarter,i+1,repr(content[:3400]),flush=True)
                  except Exception as err:print('FRENDE2024_READ_ERROR',repr(err),flush=True)
                  try:
                      with urllib.request.urlopen(row['pdf_url'],timeout=15) as resp:
                          print('FRENDE_REDIRECT',quarter,resp.geturl(),resp.headers.get('Content-Type'),flush=True)
                  except Exception as e:print('FRENDE_REDIRECT_ERROR',repr(e),flush=True)
          url='https://storage.mfn.se/34613cd2-9b91-47d8-bae6-1c5274fa1298/interim-report-q3-2025-prot.pdf'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=18) as resp:
                  blob=resp.read(20_000_000)
              with pdfplumber.open(io.BytesIO(blob)) as pdf:
                  for i,page in enumerate(pdf.pages):
                      text=page.extract_text(layout=False) or ''
                      if 'Segment information - Q3' in text:
                          print('PROTECTOR2024_Q3_PAGE',i+1,repr(text[:8000]),flush=True)

              from import_protector_norway_historical_pdf import parse_norway_revenue
              import hashlib
              all_pages=[(n+1,p.extract_text(layout=False) or '') for n,p in enumerate(pdf.pages)]
              data=parse_norway_revenue(all_pages,url,hashlib.sha256(blob).hexdigest())
              print('PROTECTOR_HISTORICAL_IMPORT',[(r['year'],r['value']) for r in data],flush=True)
          except Exception as exc:print('PROTECTOR2024_ERROR',type(exc).__name__,str(exc)[:250],flush=True)
          PY
