name = "forsikringsbarometeret-broker-admin"
main = "src/index.js"
compatibility_date = "2026-07-01"
workers_dev = true
# Preserve runtime variables set through Cloudflare dashboard on GitHub deploy.
# This includes ACCESS_AUD, ACCESS_TEAM_DOMAIN and ADMIN_EMAILS.
keep_vars = true

# Replace the placeholder ID after creating D1 in your Cloudflare account.
# This Worker MUST be fronted by a Cloudflare Access application in production.
[[d1_databases]]
binding = "DB"
database_name = "forsikringsbarometeret-broker-db"
database_id = "c24e4e43-aa0d-4932-9dd4-0914e276ebeb"
migrations_dir = "migrations"

# Reuse the existing private R2 bucket. Do not enable public R2 access.
# Existing PDF paths use Company/YYYY/QN/*.pdf; importing them into D1/Queue
# requires a separate migration step before they appear in this admin app.
[[r2_buckets]]
binding = "REPORTS"
bucket_name = "forsikringsbarometeret-rapporter"

[[queues.producers]]
binding = "BROKER_JOBS"
queue = "forsikringsbarometeret-broker-analysis"

[[queues.consumers]]
queue = "forsikringsbarometeret-broker-analysis"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1
dead_letter_queue = "forsikringsbarometeret-broker-deadletter"

[triggers]
crons = ["13 1 * * *"]

[vars]
GITHUB_REPO = "lindkb-sketch/forsikringsbarometeret"
OPENAI_MODEL = "gpt-4.1"
# ACCESS_TEAM_DOMAIN, ACCESS_AUD, ADMIN_EMAILS are managed in the Cloudflare dashboard.
# keep_vars preserves them across Wrangler deployments. Do not commit personal emails.
# OPENAI_API_KEY and GITHUB_TOKEN are secrets. NEVER put their values here.
